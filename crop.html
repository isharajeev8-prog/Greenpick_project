<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Agriculture - Crop Recommendation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body { 
            background-color: #e8f5e9; 
            color: #263238;
            margin: 0; 
            padding-bottom: 40px;
        }

        /* 🟢 Dark Green Header */
        header {
            background-color: #1b5e20; 
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        /* 🟢 White Logo Text */
        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Header Link Underline Animation */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #f1f8e9;
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        .container { max-width: 500px; background: white; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #27ae60; }
        #result { margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #2ecc71; font-size: 18px; text-align: center; display: none; }
    </style>
</head>
<body>

    <!-- 🟢 Header Section Added Here -->
    <header>
        <div class="logo">GreenPick</div>
        <nav>
            <a href="homepg.html">Home</a>
            <a href="homepg.html#about">About Us</a>
        </nav>
    </header>

    <div class="container">
        <h2>🌾 Crop Recommendation</h2>
        <form id="cropForm">
            <div class="form-group"><label>Nitrogen (N):</label><input type="number" id="n" step="any" required></div>
            <div class="form-group"><label>Phosphorus (P):</label><input type="number" id="p" step="any" required></div>
            <div class="form-group"><label>Potassium (K):</label><input type="number" id="k" step="any" required></div>
            <div class="form-group"><label>Temperature (°C):</label><input type="number" id="temp" step="any" required></div>
            <div class="form-group"><label>Humidity (%):</label><input type="number" id="humidity" step="any" required></div>
            <div class="form-group"><label>pH Level:</label><input type="number" id="ph" step="any" required></div>
            <div class="form-group"><label>Rainfall (mm):</label><input type="number" id="rainfall" step="any" required></div>
            <button type="submit">Predict Crop</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('cropForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                nitrogen: parseFloat(document.getElementById('n').value),
                phosphorus: parseFloat(document.getElementById('p').value),
                potassium: parseFloat(document.getElementById('k').value),
                temperature: parseFloat(document.getElementById('temp').value),
                humidity: parseFloat(document.getElementById('humidity').value),
                ph: parseFloat(document.getElementById('ph').value),
                rainfall: parseFloat(document.getElementById('rainfall').value)
            };

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerText = 'Predicting...';

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                resultDiv.innerHTML = `<strong>Recommended Crop:</strong> ${result.recommended_crop || result.prediction}`;
            } catch (error) {
                resultDiv.innerHTML = `<span style="color:red;">Error connecting to backend!</span>`;
            }
        });
    </script>
</body>
</html>
